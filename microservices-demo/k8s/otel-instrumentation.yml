apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: microservices-demo-instrumentation
  namespace: microservices-demo
spec:
  exporter:
    endpoint: http://microservices-demo-collector.opentelemetry-operator-system.svc.cluster.local:4317
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1"
  python:
    env:
    - name: OTEL_METRICS_EXPORTER
      value: none
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: grpc

    # - name: OTEL_LOG_LEVEL
    #   value: DEBUG
    # - name: OTEL_EXPORTER_CONSOLE
    #   value: "true"
    - name: OTEL_TRACES_EXPORTER
      value: otlp,console